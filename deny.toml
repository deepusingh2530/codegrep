# cargo-deny configuration — license, advisory, and dependency hygiene gate.
# Run locally: cargo deny check
# CI: `cargo-deny` job in .github/workflows/ci.yml
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
# Dependency hygiene: every third-party crate must be permissively licensed.
# `PolyForm-Noncommercial-1.0.0` is here for the project's OWN workspace crates
# (cargo-deny checks path/workspace members too), not as an invitation to take
# a noncommercial dependency.
allow = [
    "MIT",
    "Apache-2.0",
    "BSL-1.0",
    "Unlicense",
    "Unicode-3.0",
    "PolyForm-Noncommercial-1.0.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
