<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="codegrep">
  <title>codegrep</title>
  <defs>
    <linearGradient id="cg-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141C2E"/>
      <stop offset="1" stop-color="#0A0F1A"/>
    </linearGradient>
    <linearGradient id="cg-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A3D"/>
      <stop offset="1" stop-color="#E4572E"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#cg-bg)"/>

  <!-- shield: the "SAST" half of the brand -->
  <path d="M32 10.5 L50 17 v14.5 c0 11.5-8.6 19.3-18 23.5 c-9.4-4.2-18-12-18-23.5 V17 z"
        fill="none" stroke="url(#cg-accent)" stroke-width="3.4"
        stroke-linejoin="round"/>

  <!-- grep prompt: the "grep" half of the brand -->
  <path d="M24.5 25.5 L30.5 31.5 L24.5 37.5"
        fill="none" stroke="#F2F5FA" stroke-width="3.2"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M34.5 38.5 H42" fill="none" stroke="#F2F5FA" stroke-width="3.2" stroke-linecap="round"/>
</svg>
