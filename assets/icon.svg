<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="scanward">
  <title>scanward</title>
  <defs>
    <linearGradient id="sw-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141C2E"/>
      <stop offset="1" stop-color="#0A0F1A"/>
    </linearGradient>
    <linearGradient id="sw-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A3D"/>
      <stop offset="1" stop-color="#E4572E"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#sw-bg)"/>

  <!-- ward: the shield -->
  <path d="M32 11.5 L49 17.7 v13.9 c0 11-8.2 18.5-17 22.5 c-8.8-4-17-11.5-17-22.5 V17.7 z"
        fill="none" stroke="url(#sw-accent)" stroke-width="3.6" stroke-linejoin="round"/>

  <!-- scan: one chevron, bold enough to survive a 16px favicon -->
  <path d="M25 25.5 L33 32 L25 38.5" fill="none" stroke="#F2F5FA" stroke-width="4.2"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>