<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64" role="img" aria-label="scanward — fast, fully-offline SAST">
  <title>scanward</title>
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16203A"/>
      <stop offset="1" stop-color="#0A0F1A"/>
    </linearGradient>
    <linearGradient id="lock-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A3D"/>
      <stop offset="1" stop-color="#E4572E"/>
    </linearGradient>
  </defs>

  <!-- Dark plate: keeps the wordmark legible on light *and* dark pages. -->
  <rect width="320" height="64" rx="14" fill="url(#plate)"/>

  <!-- mark: shield (SAST) + grep prompt -->
  <g transform="translate(14 12) scale(0.625)">
    <path d="M32 9.5 L49 16.4 v14.6 c0 11.5-8.6 19.3-18 23.5 c-9.4-4.2-18-12-18-23.5 V16.4 z"
          fill="none" stroke="url(#lock-accent)" stroke-width="4"
          stroke-linejoin="round"/>
    <path d="M24 24.5 L30.5 31 L24 37.5"
          fill="none" stroke="#F2F5FA" stroke-width="4"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M34.5 38.5 H42" fill="none" stroke="#F2F5FA" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- wordmark: mono face, because the CLI is where the scan happens -->
  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace"
     font-size="28" font-weight="700" letter-spacing="-0.5">
    <text x="80" y="41" fill="#F2F5FA">code<tspan fill="#FF8A3D">grep</tspan></text>
  </g>
</svg>
