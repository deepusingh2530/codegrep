<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 72" width="330" height="72" role="img" aria-label="scanward — fast, fully-offline SAST">
  <title>scanward</title>
  <defs>
    <linearGradient id="swl-plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16203A"/>
      <stop offset="1" stop-color="#0A0F1A"/>
    </linearGradient>
    <linearGradient id="swl-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A3D"/>
      <stop offset="1" stop-color="#E4572E"/>
    </linearGradient>
  </defs>

  <!-- Dark plate: keeps the wordmark legible on light *and* dark pages. -->
  <rect width="330" height="72" rx="16" fill="url(#swl-plate)"/>

  <!-- mark -->
  <g transform="translate(10 12) scale(0.75)">
    <path d="M32 11.5 L49 17.7 v13.9 c0 11-8.2 18.5-17 22.5 c-8.8-4-17-11.5-17-22.5 V17.7 z"
          fill="none" stroke="url(#swl-accent)" stroke-width="3.6" stroke-linejoin="round"/>
    <path d="M25 25.5 L33 32 L25 38.5" fill="none" stroke="#F2F5FA" stroke-width="4.2"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- wordmark: mono, because the CLI is where the scan actually happens -->
  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace"
     font-size="31" font-weight="700" letter-spacing="-0.5">
    <text x="78" y="45" fill="#F2F5FA">scan<tspan fill="#FF8A3D">ward</tspan></text>
  </g>
</svg>