name: ci
on: [push, pull_request]
# All actions are pinned to full commit SHAs (Dependabot keeps them current).
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Unit + integration tests
        run: cargo test --workspace
      - name: Lint (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build release binary
        run: cargo build --release -p codegrep
      - name: Rule corpus gate (1183 rules, 2152 fixtures)
        run: ./target/release/codegrep rule test rules/
      - name: Demo scan (testdata)
        run: ./target/release/codegrep scan ./testdata --rules ./rules --metrics
      - name: Self-scan gate (source must be clean)
        run: ./target/release/codegrep scan ./crates --min-severity warning --error
      - name: SARIF report (testdata findings)
        if: always()
        run: ./target/release/codegrep scan ./testdata --sarif -o results.sarif
      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: results-sarif
          path: results.sarif

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: cargo-deny (advisories, licenses, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Dependency review (fail on high+ advisories)
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
