name: release
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Tests
        run: cargo test --workspace
      - name: Rule corpus gate
        run: |
          cargo build -q --release
          ./target/release/codegrep rule test rules/ > /dev/null
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::warning::CARGO_REGISTRY_TOKEN secret not set — crates.io publish skipped"
          else
            ./scripts/publish.sh
          fi

  # Signed binaries + SBOM attached to the GitHub Release for the tag.
  artifacts:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write   # create/upload GitHub Release
      id-token: write   # cosign keyless signing (OIDC)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-gnu
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            name: linux-musl
            target: x86_64-unknown-linux-musl
          - os: macos-latest
            name: macos-arm64
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release -p codegrep --target ${{ matrix.target }}
      - name: Package
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/codegrep"
          [ "$RUNNER_OS" = "Windows" ] || true
          mkdir -p dist
          cp "$BIN" dist/codegrep
          cp LICENSE README.md dist/
          tar -czf "codegrep-${GITHUB_REF_NAME}-${{ matrix.name }}.tar.gz" -C dist .
      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          output-file: "sbom-${{ matrix.name }}.cdx.json"
          artifact-name: "sbom-${{ matrix.name }}.cdx.json"
          upload-artifact: true
          upload-release-assets: false
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign binary (keyless)
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle "codegrep-${GITHUB_REF_NAME}-${{ matrix.name }}.sig.bundle" \
            "codegrep-${GITHUB_REF_NAME}-${{ matrix.name }}.tar.gz"
      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FILES=("codegrep-${GITHUB_REF_NAME}-${{ matrix.name }}.tar.gz"
                 "codegrep-${GITHUB_REF_NAME}-${{ matrix.name }}.sig.bundle"
                 "sbom-${{ matrix.name }}.cdx.json")
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${FILES[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            # Another matrix job may create the release between view and
            # create; on that 422 fall back to uploading to theirs.
            gh release create "$GITHUB_REF_NAME" "${FILES[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "codegrep ${GITHUB_REF_NAME}" \
              --generate-notes \
              || gh release upload "$GITHUB_REF_NAME" "${FILES[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          fi
