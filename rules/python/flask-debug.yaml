id: flask-debug-mode
languages: [python]
severity: WARNING
category: security:misconfig
message: Flask debug server enabled; exposes debugger console
fix: Never enable debug in production
pattern-either:
  - pattern: app.run(debug=True)
  - pattern: app.run($VAR, debug=True, ...)
metadata:
  owasp: A05:2021-Misconfiguration
  cwe: CWE-215
  confidence: MEDIUM
