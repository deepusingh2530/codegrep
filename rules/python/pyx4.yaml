  metadata:
    "owasp": "A02:2021-Crypto-Failures"
    "cwe": "CWE-330"
    "confidence": "MEDIUM"
- id: "py-random-seed-time"
  languages: ["python"]
  severity: "WARNING"
  category: "security:weak-crypto"
  message: "PRNG seeded from wall-clock time (predictable outputs)"
  fix: "Use the secrets module for security-sensitive values"
  pattern: "random.seed($SEED)"
  metavariable-regex:
    "SEED": "time\\.|perf_counter"
  metadata:
    "owasp": "A02:2021-Crypto-Failures"
    "cwe": "CWE-330"
    "confidence": "MEDIUM"
- id: "py-ssl-ciphers-weak"
  languages: ["python"]
  severity: "WARNING"
  category: "security:weak-crypto"
  message: "TLS context configured with weak cipher suites"
  fix: "Use set_ciphers('HIGH:!aNULL') or the modern defaults"
