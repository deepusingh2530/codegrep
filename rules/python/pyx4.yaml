- id: "py-jwt-encode-none"
  languages: ["python"]
  severity: "ERROR"
  category: "security:owasp-a2-crypto"
  message: "JWT encoded with the 'none' algorithm (unsigned token)"
  fix: "Sign tokens with a pinned algorithm such as HS256 or RS256"
  pattern: "algorithm=$ALG)"
  metavariable-regex:
    "ALG": "(?i)^\\s*\"?none\"?\\s*$"
  metadata:
    "owasp": "A07:2021-Identification-Auth"
    "cwe": "CWE-347"
    "confidence": "HIGH"
- id: "py-flask-render-template-user"
  languages: ["python"]
  severity: "ERROR"
  category: "security:ssti"
  message: "Template name for render_template comes from request input"
  fix: "Use a fixed template name; pass user data only as template variables"
  pattern: "render_template($T)"
  metavariable-regex:
    "T": "request\\."
  metadata:
    "owasp": "A03:2021-Injection"
    "cwe": "CWE-94"
    "confidence": "MEDIUM"
- id: "py-flask-send-from-directory"
  languages: ["python"]
  severity: "ERROR"
  category: "security:path-traversal"
  message: "send_from_directory filename comes from request input (path traversal)"
  fix: "Resolve under the upload root and reject '..' and absolute paths"
  pattern: "send_from_directory($D, $F)"
  metavariable-regex:
    "F": "request\\."
  metadata:
    "owasp": "A01:2021-Broken-Access-Control"
    "cwe": "CWE-22"
    "confidence": "MEDIUM"
- id: "py-django-httponly-off"
  languages: ["python"]
  severity: "WARNING"
  category: "security:misconfig"
  message: "Session cookies readable from JavaScript (HttpOnly disabled)"
  fix: "Set SESSION_COOKIE_HTTPONLY = True"
  pattern: "SESSION_COOKIE_HTTPONLY = False"
  metadata:
    "owasp": "A05:2021-Misconfiguration"
    "cwe": "CWE-1004"
    "confidence": "HIGH"
- id: "py-bind-all-interfaces"
  languages: ["python"]
  severity: "WARNING"
  category: "security:misconfig"
  message: "Server socket bound to all network interfaces"
  fix: "Bind to 127.0.0.1 unless external access is required"
  pattern: "bind($ADDR)"
  metavariable-regex:
    "ADDR": "0\\.0\\.0\\.0"
  metadata:
    "owasp": "A05:2021-Misconfiguration"
    "cwe": "CWE-668"
    "confidence": "MEDIUM"
- id: "py-socket-ssrf"
  languages: ["python"]
  severity: "ERROR"
  category: "security:owasp-a10-ssrf"
  message: "Outbound connection target comes from request input (SSRF)"
  fix: "Allowlist destination hosts or map the parameter to known endpoints"
  pattern: "create_connection($ADDR)"
  metavariable-regex:
    "ADDR": "request\\.|params"
  metadata:
    "owasp": "A10:2021-SSRF"
    "cwe": "CWE-918"
    "confidence": "MEDIUM"
- id: "py-paramiko-exec"
  languages: ["python"]
  severity: "ERROR"
  category: "security:owasp-a1-injection"
  message: "SSH command executed with request-controlled text"
  fix: "Constrain the command to a fixed allowlist"
  pattern: "exec_command($CMD)"
  metavariable-regex:
    "CMD": "request\\.|params"
  metadata:
    "owasp": "A03:2021-Injection"
    "cwe": "CWE-78"
    "confidence": "MEDIUM"
- id: "py-uuid1-token"
  languages: ["python"]
  severity: "WARNING"
  category: "security:weak-crypto"
