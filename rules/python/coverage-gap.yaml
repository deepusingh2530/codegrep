- id: "py-encoded-path-traversal"
  languages: ["python"]
  severity: "ERROR"
  category: "security:path-traversal"
  message: "Filesystem path built from a still-encoded traversal payload"
  fix: "urllib.parse.unquote once, then os.path.realpath and check the prefix"
  pattern-either:
    - pattern: "os.path.join($BASE, unquote($IN))"
    - pattern: "os.path.join($BASE, urllib.parse.unquote($IN))"
    - pattern: "open(unquote($IN))"
    - pattern: "send_file(unquote($IN))"
  metavariable-regex:
    "IN": "request|argv|param|input|query|args|GET|POST|body|filename|\\$_(GET|POST|REQUEST)"
  metadata:
    "owasp": "A01:2021-Broken-Access-Control"
    "cwe": "CWE-22"
    "confidence": "MEDIUM"
- id: "py-ssrf-idn-host"
  languages: ["python"]
  severity: "ERROR"
  category: "security:owasp-a10-ssrf"
  message: "Outbound HTTP request to a host taken from request data (SSRF)"
  fix: "Resolve the host and compare it against an allowlist before requesting"
  pattern-either:
    - pattern: "requests.get($URL)"
    - pattern: "requests.get($URL, ...)"
    - pattern: "requests.post($URL)"
    - pattern: "requests.post($URL, ...)"
    - pattern: "httpx.get($URL)"
    - pattern: "httpx.post($URL)"
    - pattern: "urlopen($URL)"
    - pattern: "urlopen($URL, ...)"
  metavariable-regex:
    "URL": "[Uu]ser|[Ii]nput|[Qq]uery|[Pp]aram|[Rr]eq|[Hh]ost|[Uu]rl"
  metadata:
    "owasp": "A10:2021-Server-Side-Request-Forgery"
    "cwe": "CWE-918"
    "confidence": "MEDIUM"
