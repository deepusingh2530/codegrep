id: py-hardcoded-secret
languages: [python]
severity: WARNING
category: security:secrets
message: Possible hardcoded secret in assignment
fix: Load secrets from env or secret manager
pattern-either:
  - pattern: $VAR = "AKIA$REST"
  - pattern: $VAR = "sk-$REST"
metavariable-regex:
  REST: .{8,}
