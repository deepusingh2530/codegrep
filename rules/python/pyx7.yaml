- id: "py-compile-exec-mode"
  languages: ["python"]
  severity: "WARNING"
  category: "security:code-execution"
  message: "compile() with exec/single mode builds executable code"
  fix: "Avoid compiling dynamic source; validate inputs"
  pattern-either:
    - pattern: "compile($SRC, $F, \"exec\")"
    - pattern: "compile($SRC, $F, \"single\")"
  metadata:
    "owasp": "A03:2021-Injection"
    "cwe": "CWE-94"
    "confidence": "MEDIUM"
