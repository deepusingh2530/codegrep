id: py-command-injection
languages: [python]
severity: ERROR
category: security:owasp-a1-injection
message: Possible command injection via os.system / subprocess with shell
fix: Avoid shell=True; use subprocess.run([...]) with static args
pattern-either:
  - pattern: os.system($VAR)
  - pattern: subprocess.call($VAR)
  - pattern: subprocess.call($VAR, ...)
  - pattern: subprocess.Popen($VAR)
  - pattern: subprocess.Popen($VAR, ...)
metadata:
  owasp: A03:2021-Injection
  cwe: CWE-78
  confidence: HIGH
