    "confidence": "MEDIUM"
- id: "tf-hardcoded-password"
  languages: ["terraform"]
  severity: "ERROR"
  category: "security:secrets"
  message: "Hardcoded password in Terraform config"
  fix: "Use a variable backed by a secret store"
  pattern: "password = \""
  metadata:
    "owasp": "A07:2021-Identification-Auth"
    "cwe": "CWE-798"
    "confidence": "HIGH"
- id: "tf-ecs-privileged"
  languages: ["terraform"]
  severity: "ERROR"
  category: "security:misconfig"
  message: "Container runs in privileged mode"
  fix: "Remove privileged = true; drop capabilities instead"
  pattern: "privileged = true"
  metadata:
    "owasp": "A05:2021-Misconfiguration"
    "cwe": "CWE-250"
    "confidence": "HIGH"
