- id: "tf-sg-open-rdp"
  languages: ["terraform"]
  severity: "ERROR"
  category: "security:misconfig"
  message: "Security group opens RDP (3389) to the network"
  fix: "Restrict ingress rules to known networks"
  pattern: "from_port = 3389"
  pattern-inside: "resource \"aws_security_group\""
  metadata:
    "owasp": "A01:2021-Broken-Access-Control"
    "cwe": "CWE-284"
    "confidence": "MEDIUM"
- id: "tf-iam-policy-wildcard-resource"
  languages: ["terraform"]
  severity: "ERROR"
  category: "security:misconfig"
  message: "IAM policy grants access to all resources (*)"
  fix: "Scope Resource to specific ARNs"
  pattern: "Resource = \"*\""
  metadata:
    "owasp": "A01:2021-Broken-Access-Control"
    "cwe": "CWE-269"
    "confidence": "MEDIUM"
- id: "tf-kms-key-rotation-off"
  languages: ["terraform"]
  severity: "WARNING"
  category: "security:misconfig"
  message: "KMS key rotation disabled"
  fix: "Set enable_key_rotation = true"
  pattern: "enable_key_rotation = false"
  metadata:
    "owasp": "A02:2021-Crypto-Failures"
    "cwe": "CWE-334"
    "confidence": "MEDIUM"
- id: "tf-rds-storage-unencrypted"
  languages: ["terraform"]
  severity: "ERROR"
  category: "security:weak-crypto"
  message: "RDS storage encryption disabled"
  fix: "Set storage_encrypted = true"
  pattern: "storage_encrypted = false"
  metadata:
    "owasp": "A02:2021-Crypto-Failures"
    "cwe": "CWE-311"
    "confidence": "HIGH"
- id: "tf-ec2-public-ip"
  languages: ["terraform"]
  severity: "WARNING"
  category: "security:misconfig"
  message: "EC2 instance gets a public IP address"
  fix: "Disable public IPs or place behind a load balancer"
  pattern: "associate_public_ip_address = true"
  metadata:
    "owasp": "A01:2021-Broken-Access-Control"
    "cwe": "CWE-150"
    "confidence": "MEDIUM"
- id: "tf-elb-http-listener"
  languages: ["terraform"]
  severity: "WARNING"
  category: "security:misconfig"
  message: "Load balancer listener uses unencrypted HTTP"
  fix: "Use HTTPS on the listener"
  pattern: "protocol = \"HTTP\""
  metadata:
    "owasp": "A02:2021-Crypto-Failures"
