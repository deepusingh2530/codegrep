- id: "tf-random-password-short"
  languages: ["terraform"]
  severity: "WARNING"
  category: "security:misconfig"
  message: "random_password generates a very short password"
  fix: "Use length >= 16 (or num_bytes >= 32)"
  pattern-either:
    - pattern: "random_password ... length = 6"
    - pattern: "random_password ... length = 8"
    - pattern: "random_password ... length = 10"
    - pattern: "random_password ... num_bytes = 8"
  metadata:
    "owasp": "A07:2021-Identification-Auth"
    "cwe": "CWE-521"
    "confidence": "HIGH"
- id: "tf-password-length-short"
  languages: ["terraform"]
  severity: "WARNING"
  category: "security:misconfig"
  message: "Account password policy minimum length below 12"
  fix: "Require at least 12 characters"
  pattern-either:
    - pattern: "minimum_password_length = 6"
    - pattern: "minimum_password_length = 7"
    - pattern: "minimum_password_length = 8"
    - pattern: "minimum_password_length = 10"
    - pattern: "minimum_length = 6"
    - pattern: "minimum_length = 7"
    - pattern: "minimum_length = 8"
    - pattern: "minimum_length = 10"
  metadata:
    "owasp": "A07:2021-Identification-Auth"
    "cwe": "CWE-521"
    "confidence": "HIGH"
