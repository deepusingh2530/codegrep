- id: "dart-command-injection"
  languages: ["dart"]
  severity: "ERROR"
  category: "security:code-execution"
  message: "Process spawned with a command taken from user-controlled data"
  fix: "Use a fixed executable and pass user data as arguments"
  pattern-either:
    - pattern: "Process.run($CMD"
    - pattern: "Process.start($CMD"
  metavariable-regex:
    "CMD": "[Uu]ser|[Ii]nput|[Aa]rgs|[Pp]arams?|[Qq]uery"
  metadata:
    "owasp": "A03:2021-Injection"
    "cwe": "CWE-78"
    "confidence": "HIGH"
- id: "dart-spawn-uri"
  languages: ["dart"]
  severity: "ERROR"
  category: "security:code-execution"
  message: "Isolate spawned from a URI derived from user-controlled data"
  fix: "Load only bundled entrypoints; never spawn code from request data"
  pattern: "Isolate.spawnUri($URI"
  metavariable-regex:
    "URI": "[Uu]ser|[Ii]nput|[Qq]uery|[Pp]aram|[Rr]equest"
  metadata:
    "owasp": "A08:2021-Integrity-Failure"
    "cwe": "CWE-94"
    "confidence": "HIGH"
- id: "dart-sql-string-interpolation"
  languages: ["dart"]
  severity: "ERROR"
  category: "security:owasp-a1-injection"
  message: "SQL built with Dart string interpolation (SQL injection)"
  fix: "Use bound arguments (? placeholders) instead of interpolating SQL"
  pattern-either:
    - pattern: "rawQuery($Q"
    - pattern: "execute($Q"
  metavariable-regex:
    "Q": "[Ff]ormat|[Uu]ser|[Ii]nput|[Pp]aram|[Qq]uery|\\$|\\+"
  metadata:
    "owasp": "A03:2021-Injection"
    "cwe": "CWE-89"
    "confidence": "HIGH"
- id: "dart-open-redirect-user-input"
  languages: ["dart"]
  severity: "ERROR"
  category: "security:open-redirect"
  message: "URL launched from user-controlled data (open redirect)"
  fix: "Resolve the target against an allowlist of local URLs"
  pattern: "launchUrl($URL"
  metavariable-regex:
    "URL": "[Uu]ser|[Ii]nput|[Qq]uery|[Pp]aram|[Nn]ext|[Ff]rom"
  metadata:
    "owasp": "A01:2021-Broken-Access-Control"
    "cwe": "CWE-601"
    "confidence": "HIGH"
- id: "dart-ssrf-user-input"
  languages: ["dart"]
  severity: "ERROR"
  category: "security:owasp-a10-ssrf"
  message: "HTTP request URL taken from user-controlled data (SSRF)"
  fix: "Validate the URL against an allowlist of hosts/schemes"
  pattern-either:
    - pattern: "http.get($URL"
    - pattern: "http.post($URL"
  metavariable-regex:
    "URL": "[Uu]ser|[Ii]nput|[Qq]uery|[Pp]aram|[Rr]equest|[Nn]ext"
  metadata:
    "owasp": "A10:2021-Server-Side-Request-Forgery"
    "cwe": "CWE-918"
    "confidence": "HIGH"
- id: "dart-html-user-input"
  languages: ["dart"]
  severity: "WARNING"
  category: "security:owasp-a3-xss"
  message: "innerHtml assigned from user-controlled data (XSS)"
  fix: "Set textContent or escape the value before assigning innerHtml"
  pattern: "innerHtml = $H"
  metavariable-regex:
    "H": "[Ff]ormat|[Uu]ser|[Ii]nput|[Rr]equest|[Qq]uery|[Pp]aram"
  metadata:
    "owasp": "A03:2021-Injection"
    "cwe": "CWE-79"
    "confidence": "HIGH"
- id: "dart-weak-md5-sha1"
  languages: ["dart"]
  severity: "WARNING"
  category: "security:weak-crypto"
  message: "MD5/SHA-1 hash used (broken for security purposes)"
  fix: "Use SHA-256+ for integrity, bcrypt/scrypt/argon2 for passwords"
  pattern-either:
    - pattern: "md5.convert("
    - pattern: "sha1.convert("
  metadata:
    "owasp": "A02:2021-Crypto-Failures"
    "cwe": "CWE-327"
    "confidence": "MEDIUM"
- id: "dart-path-traversal"
  languages: ["dart"]
  severity: "ERROR"
  category: "security:path-traversal"
  message: "File/Directory path built from user-controlled data (path traversal)"
  fix: "Canonicalize the path and confirm it stays inside the base directory"
  pattern-either:
    - pattern: "File($P"
    - pattern: "File.fromUri($P"
  metavariable-regex:
    "P": "[Uu]ser|[Ii]nput|[Qq]uery|[Pp]aram|[Rr]equest|\\.\\./"
  metadata:
    "owasp": "A01:2021-Broken-Access-Control"
    "cwe": "CWE-22"
    "confidence": "HIGH"
- id: "dart-accept-invalid-certs"
  languages: ["dart"]
  severity: "ERROR"
  category: "security:misconfig"
  message: "TLS certificate verification disabled (badCertificateCallback returns true)"
  fix: "Reject invalid certificates; pin or properly trust the server chain"
  pattern: "badCertificateCallback = $CB"
  metavariable-regex:
    "CB": "true"
  metadata:
    "owasp": "A05:2021-Security-Misconfiguration"
    "cwe": "CWE-295"
    "confidence": "HIGH"
