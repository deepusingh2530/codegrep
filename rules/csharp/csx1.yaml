- id: "csharp-weak-random"
  languages: ["csharp"]
  severity: "WARNING"
  category: "security:weak-crypto"
  message: "System.Random is predictable for security values"
  fix: "Use RandomNumberGenerator"
  pattern: "new Random($SEED)"
  metadata:
    "owasp": "A02:2021-Crypto-Failures"
    "cwe": "CWE-338"
    "confidence": "MEDIUM"
- id: "csharp-json-deserialize-typed"
  languages: ["csharp"]
  severity: "WARNING"
  category: "security:deserialization"
  message: "JsonConvert.DeserializeObject may honor type metadata"
  fix: "Avoid TypeNameHandling.All / use explicit types"
  pattern: "JsonConvert.DeserializeObject($JSON)"
  metadata:
    "owasp": "A08:2021-Integrity-Failure"
    "cwe": "CWE-502"
    "confidence": "MEDIUM"
- id: "csharp-xml-document-load"
  languages: ["csharp"]
  severity: "WARNING"
  category: "security:xxe"
  message: "XmlDocument.Load may resolve external entities (XXE)"
  fix: "Set XmlResolver = null and disable DTDs"
  pattern: ".Load($SRC)"
  pattern-inside: "XmlDocument"
  metadata:
    "owasp": "A03:2021-Injection"
    "cwe": "CWE-611"
    "confidence": "MEDIUM"
