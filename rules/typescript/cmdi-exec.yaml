id: ts-cmdi-exec
languages: [typescript]
severity: ERROR
category: security:code-execution
message: Possible command injection via child_process exec on user input
fix: Avoid exec with user input; use execFile with static args
pattern-either:
  - pattern: exec($VAR)
  - pattern: exec($VAR, ...)
metadata:
  owasp: A03:2021-Injection
  cwe: CWE-78
  confidence: MEDIUM
