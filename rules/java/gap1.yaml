- id: "java-log-request-input"
  languages: ["java"]
  severity: "WARNING"
  category: "security:owasp-a1-injection"
  message: "Untrusted request parameter written straight to logs (log injection)"
  fix: "Sanitize or structure-log the parameter"
  pattern: "log.info($MSG)"
  metavariable-regex:
    "MSG": "getParameter|getQueryString|request\\."
  metadata:
    "owasp": "A03:2021-Injection"
    "cwe": "CWE-117"
    "confidence": "MEDIUM"
- id: "java-upload-client-filename"
  languages: ["java"]
  severity: "ERROR"
  category: "security:code-execution"
  message: "Upload stored under the client-supplied original filename"
  fix: "Generate a server-side name and validate the content type"
  pattern: "new File($DIR, $NAME)"
  metavariable-regex:
    "NAME": "getOriginalFilename"
  metadata:
    "owasp": "A08:2021-Integrity-Failure"
    "cwe": "CWE-434"
    "confidence": "HIGH"
- id: "java-ldap-search-user-filter"
  languages: ["java"]
  severity: "WARNING"
  category: "security:owasp-a1-injection"
  message: "LDAP search filter is built from request input (LDAP injection)"
  fix: "Escape filter values (DirContext.escapeFilterValue / spring-ldap)"
  pattern: "search($BASE, $FILTER)"
  metavariable-regex:
    "FILTER": "getParameter|getQueryString|request\\."
  metadata:
    "owasp": "A03:2021-Injection"
    "cwe": "CWE-90"
    "confidence": "HIGH"
- id: "java-password-base64"
  languages: ["java"]
  severity: "WARNING"
  category: "security:weak-crypto"
  message: "Password material protected only with base64 (reversible encoding)"
  fix: "Hash with bcrypt/scrypt/argon2; never store recoverable credentials"
  pattern: "Base64.getEncoder().encode($PW)"
  metavariable-regex:
    "PW": "pass|pwd|secret"
  metadata:
    "owasp": "A02:2021-Crypto-Failures"
    "cwe": "CWE-522"
    "confidence": "MEDIUM"
