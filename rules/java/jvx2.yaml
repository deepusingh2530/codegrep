- id: "java-ognl-eval"
  languages: ["java"]
  severity: "ERROR"
  category: "security:code-execution"
  message: "OGNL expression evaluated from input (expression injection)"
  fix: "Never evaluate untrusted expressions"
  pattern: "Ognl.getValue($EXPR)"
  metadata:
    "owasp": "A03:2021-Injection"
    "cwe": "CWE-917"
    "confidence": "HIGH"
- id: "java-spel-eval"
  languages: ["java"]
  severity: "ERROR"
  category: "security:code-execution"
  message: "Spring SpEL expression parsed from input (expression injection)"
  fix: "Never parse untrusted expressions"
  pattern: "parseExpression($EXPR)"
  metadata:
    "owasp": "A03:2021-Injection"
    "cwe": "CWE-917"
    "confidence": "HIGH"
- id: "java-object-input-stream"
  languages: ["java"]
  severity: "ERROR"
