- id: "java-mvel-eval"
  languages: ["java"]
  severity: "ERROR"
  category: "security:code-execution"
  message: "MVEL expression evaluated from input"
  fix: "Never evaluate untrusted expressions"
  pattern: "MVEL.eval($EXPR)"
  metadata:
    "owasp": "A03:2021-Injection"
    "cwe": "CWE-917"
    "confidence": "HIGH"
- id: "java-velocity-eval"
  languages: ["java"]
  severity: "ERROR"
  category: "security:ssti"
  message: "Velocity evaluates a template built from input (SSTI)"
