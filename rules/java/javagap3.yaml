  metadata:
    "owasp": "A02:2021-Crypto-Failures"
    "cwe": "CWE-916"
    "confidence": "HIGH"
- id: "java-rsa-pkcs1-padding"
  languages: ["java"]
  severity: "WARNING"
  category: "security:weak-crypto"
  message: "RSA with PKCS#1 v1.5 padding (padding oracle risk)"
  fix: "Use RSA/ECB/OAEPWithSHA-256AndMGF1Padding"
  pattern: "\"RSA/ECB/PKCS1Padding\""
  metadata:
    "owasp": "A02:2021-Crypto-Failures"
    "cwe": "CWE-780"
    "confidence": "HIGH"
- id: "java-http-invoker-exporter"
  languages: ["java"]
  severity: "ERROR"
  category: "security:deserialization"
  message: "Spring HttpInvokerServiceExporter exposed (Java deserialization endpoint)"
  fix: "Remove the exporter; use a JSON API instead"
  pattern: "HttpInvokerServiceExporter"
  metadata:
    "owasp": "A08:2021-Integrity-Failure"
    "cwe": "CWE-502"
    "confidence": "HIGH"
- id: "java-posix-permissions-open"
  languages: ["java"]
  severity: "WARNING"
  category: "security:file-permissions"
  message: "World-writable file permissions set"
  fix: "Grant the minimum owner/group permissions required"
  pattern: "setPosixFilePermissions($P, $PERMS)"
  metavariable-regex:
