  metadata:
    "owasp": "A05:2021-Misconfiguration"
    "cwe": "CWE-732"
    "confidence": "HIGH"
- id: "java-redos-pattern-compile"
  languages: ["java"]
  severity: "WARNING"
  category: "security:denial-of-service"
