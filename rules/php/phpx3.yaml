- id: "php-hardcoded-password"
  languages: ["php"]
  severity: "ERROR"
  category: "security:secrets"
  message: "Hardcoded password in source"
  fix: "Load the password from an environment variable or secret store"
  pattern: "$PW = \""
  metavariable-regex:
    "PW": "^\\$(password|passwd|pwd|pass|db_pass|db_password|secret)$"
  metadata:
    "owasp": "A07:2021-Identification-Auth"
    "cwe": "CWE-798"
    "confidence": "HIGH"
- id: "php-hardcoded-salt"
  languages: ["php"]
  severity: "WARNING"
  category: "security:weak-crypto"
  message: "Hardcoded salt value"
  fix: "Derive a unique salt per secret"
  pattern-either:
    - pattern: "$SALT = \""
    - pattern: "$SALT=\""
  metavariable-regex:
    "SALT": "^\\$salt$"
  metadata:
    "owasp": "A02:2021-Crypto-Failures"
    "cwe": "CWE-760"
    "confidence": "MEDIUM"
- id: "php-curl-tls-verify-off"
  languages: ["php"]
  severity: "WARNING"
  category: "security:owasp-a2-crypto"
  message: "cURL TLS certificate verification disabled"
  fix: "Keep CURLOPT_SSL_VERIFYPEER enabled and verify the peer"
  pattern-either:
    - pattern: "CURLOPT_SSL_VERIFYPEER, false"
    - pattern: "CURLOPT_SSL_VERIFYPEER => false"
    - pattern: "CURLOPT_SSL_VERIFYPEER, 0"
    - pattern: "CURLOPT_SSL_VERIFYPEER => 0"
    - pattern: "CURLOPT_SSL_VERIFYHOST, 0"
    - pattern: "CURLOPT_SSL_VERIFYHOST => 0"
  metadata:
    "owasp": "A02:2021-Crypto-Failures"
    "cwe": "CWE-295"
    "confidence": "MEDIUM"
- id: "php-openssl-ecb"
  languages: ["php"]
  severity: "WARNING"
  category: "security:weak-crypto"
  message: "ECB block cipher mode in use"
  fix: "Use AES-256-GCM with a random IV"
  pattern-either:
    - pattern: "\"AES-256-ECB\""
    - pattern: "\"AES-128-ECB\""
  metadata:
    "owasp": "A02:2021-Crypto-Failures"
    "cwe": "CWE-327"
    "confidence": "MEDIUM"
- id: "php-stream-wrapper"
  languages: ["php"]
  severity: "ERROR"
  category: "security:path-traversal"
  message: "php:// stream wrapper used (LFI/RFI chains)"
  fix: "Map request input to an allowlist of local files"
  pattern-either:
    - pattern: "php://filter"
    - pattern: "php://input"
  metadata:
    "owasp": "A03:2021-Injection"
    "cwe": "CWE-98"
    "confidence": "MEDIUM"
- id: "php-hardcoded-aws-key"
  languages: ["php"]
  severity: "WARNING"
  category: "security:secrets"
  message: "Hardcoded AWS access key ID"
  fix: "Read credentials from the environment/STS"
  pattern-either:
    - pattern: "$VAR = \"AKIA$REST\""
    - pattern: "$VAR = 'AKIA$REST'"
    - pattern: "$VAR => \"AKIA$REST\""
    - pattern: "$VAR => 'AKIA$REST'"
  metadata:
    "owasp": "A07:2021-Identification-Auth"
    "cwe": "CWE-798"
    "confidence": "HIGH"
