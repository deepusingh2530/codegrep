    - pattern: "skip_before_action :require_admin"
  metadata:
    "owasp": "A01:2021-Broken-Access-Control"
    "cwe": "CWE-306"
    "confidence": "MEDIUM"
- id: "rb-hardcoded-bearer-token"
  languages: ["ruby"]
  severity: "ERROR"
  category: "security:secrets"
