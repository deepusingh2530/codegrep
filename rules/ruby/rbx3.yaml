- id: "rb-arel-sql"
  languages: ["ruby"]
  severity: "ERROR"
  category: "security:owasp-a1-injection"
  message: "Raw SQL passed through Arel.sql (injection)"
  fix: "Use bound parameters instead of Arel.sql with dynamic text"
  pattern: "Arel.sql("
  metadata:
    "owasp": "A03:2021-Injection"
    "cwe": "CWE-89"
    "confidence": "HIGH"
- id: "rb-find-by-sqli"
  languages: ["ruby"]
  severity: "ERROR"
  category: "security:owasp-a1-injection"
  message: "find_by with request-built SQL string"
  fix: "Pass a hash of attributes instead of a SQL string"
  pattern: "find_by($EXPR)"
  metavariable-regex:
    "EXPR": "params\\[|request\\."
  metadata:
    "owasp": "A03:2021-Injection"
    "cwe": "CWE-89"
    "confidence": "HIGH"
