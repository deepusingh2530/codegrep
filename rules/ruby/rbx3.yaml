- id: "rb-psych-load"
  languages: ["ruby"]
  severity: "ERROR"
  category: "security:deserialization"
  message: "Psych/YAML load of untrusted data (object injection)"
  fix: "Use Psych.safe_load with an explicit permitted class list"
  pattern-either:
    - pattern: "Psych.load("
    - pattern: "Psych.load_file("
  metadata:
    "owasp": "A08:2021-Integrity-Failure"
    "cwe": "CWE-502"
    "confidence": "HIGH"
- id: "rb-serialize-yaml"
  languages: ["ruby"]
  severity: "ERROR"
  category: "security:deserialization"
  message: "ActiveRecord column serialized as YAML (deserialization on load)"
  fix: "Serialize with JSON instead of YAML"
  pattern: "serialize :$ATTR, YAML"
  metadata:
    "owasp": "A08:2021-Integrity-Failure"
    "cwe": "CWE-502"
    "confidence": "HIGH"
- id: "rb-hardcoded-secret-key-base"
  languages: ["ruby"]
  severity: "ERROR"
  category: "security:secrets"
  message: "Hardcoded Rails secret_key_base"
  fix: "Load secret_key_base from credentials or the environment"
  pattern-either:
    - pattern: "secret_key_base = \""
    - pattern: "secret_key_base = '"
  metadata:
    "owasp": "A07:2021-Identification-Auth"
    "cwe": "CWE-798"
    "confidence": "HIGH"
- id: "rb-execjs-eval"
  languages: ["ruby"]
  severity: "ERROR"
  category: "security:code-execution"
