    - pattern: "api_key = '"
  metadata:
    "owasp": "A07:2021-Identification-Auth"
    "cwe": "CWE-798"
    "confidence": "HIGH"
- id: "rb-db-credentials-in-url"
  languages: ["ruby"]
  severity: "ERROR"
  category: "security:secrets"
  message: "Database credentials embedded in connection URL"
  fix: "Read user and password from environment variables at runtime"
  pattern-either:
    - pattern: "postgres://$CREDS@"
    - pattern: "postgresql://$CREDS@"
    - pattern: "mysql://$CREDS@"
    - pattern: "mongodb://$CREDS@"
    - pattern: "redis://$CREDS@"
  metavariable-regex:
    "CREDS": "^[^:@]+:[^:@0-9]"
  metadata:
    "owasp": "A07:2021-Identification-Auth"
    "cwe": "CWE-798"
    "confidence": "HIGH"
