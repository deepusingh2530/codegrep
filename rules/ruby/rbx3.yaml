  languages: ["ruby"]
  severity: "ERROR"
  category: "security:owasp-a1-injection"
  message: "where() called with request-built SQL fragment"
  fix: "Use hash conditions or bind parameters"
  pattern: "where($EXPR)"
  metavariable-regex:
    "EXPR": "params\\[|request\\."
  metadata:
    "owasp": "A03:2021-Injection"
    "cwe": "CWE-89"
    "confidence": "HIGH"
- id: "rb-redirect-back-host"
