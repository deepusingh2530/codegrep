id: "ruby-ssrf-idn-host"
languages: ["ruby"]
severity: "ERROR"
category: "security:owasp-a10-ssrf"
message: "Outbound HTTP call to a host taken from request data (SSRF)"
fix: "Resolve the host and check it against an allowlist before the call"
pattern-either:
  - pattern: "Net::HTTP.get_response(URI($URL))"
  - pattern: "Net::HTTP.get(URI($URL))"
  - pattern: "open-uri($URL, ..."
  - pattern: "URI.open($URL, ..."
  - pattern: "Faraday.get($URL, ..."
metavariable-regex:
  "URL": "params\\[|request\\.|\\$[a-z_]*host|\\$[a-z_]*url|CGI"
metadata:
  "owasp": "A10:2021-Server-Side-Request-Forgery"
  "cwe": "CWE-918"
  "confidence": "MEDIUM"
