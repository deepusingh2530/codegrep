- id: "rb-cookie-httponly-false"
  languages: ["ruby"]
  severity: "WARNING"
  category: "security:misconfig"
  message: "Cookie created without the HttpOnly flag"
  fix: "Set httponly: true for session cookies"
  pattern: "httponly: false"
  metadata:
    "owasp": "A02:2021-Crypto-Failures"
    "cwe": "CWE-1004"
    "confidence": "MEDIUM"
- id: "rb-cookie-secure-false"
  languages: ["ruby"]
  severity: "WARNING"
  category: "security:misconfig"
  message: "Cookie created without the Secure flag"
  fix: "Set secure: true for cookies"
  pattern: "secure: false"
  metadata:
    "owasp": "A02:2021-Crypto-Failures"
    "cwe": "CWE-614"
    "confidence": "MEDIUM"
- id: "rb-hardcoded-secret"
  languages: ["ruby"]
  severity: "ERROR"
  category: "security:secrets"
  message: "Hardcoded password in source"
  fix: "Load credentials from a secret manager"
  pattern: "password = \""
  metadata:
    "owasp": "A07:2021-Identification-Auth"
    "cwe": "CWE-798"
    "confidence": "HIGH"
- id: "rb-weak-rand"
  languages: ["ruby"]
  severity: "WARNING"
  category: "security:weak-crypto"
  message: "Kernel#rand is not cryptographically secure"
  fix: "Use SecureRandom for tokens and nonces"
  pattern: "rand($N)"
  metadata:
    "owasp": "A02:2021-Crypto-Failures"
    "cwe": "CWE-338"
    "confidence": "MEDIUM"
- id: "rb-cipher-rc4"
  languages: ["ruby"]
  severity: "ERROR"
  category: "security:weak-crypto"
  message: "RC4 cipher selected (broken)"
  fix: "Use AES-256-GCM"
  pattern: "Cipher.new(\"rc4\")"
  metadata:
    "owasp": "A02:2021-Crypto-Failures"
    "cwe": "CWE-327"
    "confidence": "HIGH"
- id: "rb-load-user-path"
  languages: ["ruby"]
  severity: "ERROR"
  category: "security:code-execution"
  message: "Kernel#load evaluates a file from a dynamic path"
  fix: "Require a fixed, allowlisted file"
  pattern: "load($FILE)"
  pattern-not: ".load("
  metadata:
    "owasp": "A03:2021-Injection"
    "cwe": "CWE-94"
    "confidence": "HIGH"
- id: "rb-public-send-user"
  languages: ["ruby"]
  severity: "WARNING"
  category: "security:owasp-a1-injection"
  message: "public_send invoked with a user-controlled method name"
  fix: "Map input to a fixed set of methods"
  pattern: "public_send($METH)"
  metavariable-regex:
    "METH": "^[^:]"
  metadata:
    "owasp": "A03:2021-Injection"
    "cwe": "CWE-470"
    "confidence": "MEDIUM"
- id: "rb-const-get-user"
  languages: ["ruby"]
  severity: "WARNING"
  category: "security:owasp-a1-injection"
  message: "const_get invoked with a user-controlled constant name"
  fix: "Allowlist permitted constant names"
  pattern: "const_get($NAME)"
  metadata:
    "owasp": "A03:2021-Injection"
    "cwe": "CWE-470"
    "confidence": "MEDIUM"
- id: "rb-class-eval"
  languages: ["ruby"]
  severity: "ERROR"
  category: "security:code-execution"
  message: "class_eval executes a string as code"
  fix: "Avoid evaluating untrusted code"
  pattern: "class_eval($CODE)"
  metadata:
    "owasp": "A03:2021-Injection"
    "cwe": "CWE-95"
    "confidence": "HIGH"
- id: "rb-open3-popen3"
  languages: ["ruby"]
  severity: "ERROR"
  category: "security:code-execution"
  message: "Open3.popen3 runs a shell command"
  fix: "Use a fixed command with an argument array"
  pattern: "Open3.popen3($CMD)"
  metadata:
    "owasp": "A03:2021-Injection"
    "cwe": "CWE-78"
    "confidence": "HIGH"
- id: "rb-rails-debug-mode"
  languages: ["ruby"]
  severity: "INFO"
  category: "security:misconfig"
  message: "Rails debugging helpers exposed"
  fix: "Disable debug middleware in production"
  pattern: "Rails.env.development?"
  metadata:
    "owasp": "A05:2021-Misconfiguration"
    "cwe": "CWE-489"
    "confidence": "LOW"
- id: "rb-yaml-safe-load-missing"
  languages: ["ruby"]
  severity: "ERROR"
  category: "security:deserialization"
  message: "YAML.load deserializes untrusted data"
  fix: "Use YAML.safe_load for untrusted input"
  pattern: "YAML.load_file($F)"
  metadata:
    "owasp": "A08:2021-Integrity-Failure"
    "cwe": "CWE-502"
    "confidence": "HIGH"
