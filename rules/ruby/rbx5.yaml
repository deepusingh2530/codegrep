- id: "rb-hardcoded-sendgrid-key"
  languages: ["ruby"]
  severity: "ERROR"
  category: "security:secrets"
  message: "Hardcoded SendGrid API key"
  fix: "Read SENDGRID_API_KEY from the environment"
  pattern-either:
    - pattern: "$VAR = \"SG.$REST\""
    - pattern: "$VAR = 'SG.$REST'"
    - pattern: "$VAR: \"SG.$REST\""
    - pattern: "$VAR: 'SG.$REST'"
  metadata:
    "owasp": "A07:2021-Identification-Auth"
    "cwe": "CWE-798"
    "confidence": "HIGH"
