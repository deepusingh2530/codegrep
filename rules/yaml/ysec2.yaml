- id: "yaml-k8s-run-as-root"
  languages: ["yaml"]
  severity: "WARNING"
  category: "security:misconfig"
  message: "Container configured to run as root (UID 0)"
  fix: "Set runAsUser to a non-zero UID"
  pattern: "runAsUser: 0"
  metadata:
    "owasp": "A05:2021-Misconfiguration"
    "cwe": "CWE-250"
    "confidence": "MEDIUM"
- id: "yaml-k8s-privilege-escalation"
  languages: ["yaml"]
  severity: "WARNING"
  category: "security:misconfig"
  message: "Container allowed to escalate privileges"
  fix: "Set allowPrivilegeEscalation: false"
  pattern: "allowPrivilegeEscalation: true"
  metadata:
    "owasp": "A05:2021-Misconfiguration"
    "cwe": "CWE-269"
    "confidence": "MEDIUM"
- id: "yaml-k8s-image-latest-tag"
  languages: ["yaml"]
  severity: "INFO"
  category: "security:misconfig"
  message: "Container image pinned to the mutable 'latest' tag"
  fix: "Pin images to a specific digest or version"
  pattern: ": latest"
  metadata:
    "owasp": "A06:2021-Vulnerable-Components"
    "cwe": "CWE-829"
    "confidence": "LOW"
- id: "yaml-k8s-hostpath-mount"
  languages: ["yaml"]
  severity: "WARNING"
  category: "security:misconfig"
  message: "Host path mounted into the container"
  fix: "Use volumes instead of hostPath"
  pattern: "hostPath:"
  metadata:
    "owasp": "A05:2021-Misconfiguration"
    "cwe": "CWE-552"
    "confidence": "MEDIUM"
- id: "yaml-k8s-sys-admin-cap"
  languages: ["yaml"]
  severity: "ERROR"
  category: "security:misconfig"
  message: "Container adds the SYS_ADMIN capability"
  fix: "Remove SYS_ADMIN from added capabilities"
  pattern: "- SYS_ADMIN"
  metadata:
    "owasp": "A05:2021-Misconfiguration"
    "cwe": "CWE-250"
    "confidence": "HIGH"
- id: "yaml-ci-github-event-context"
  languages: ["yaml"]
  severity: "WARNING"
  category: "security:owasp-a1-injection"
  message: "Workflow interpolates untrusted github.event input into a run step"
  fix: "Avoid interpolating attacker-controlled contexts into shell"
  pattern: "github.event"
  metadata:
    "owasp": "A03:2021-Injection"
    "cwe": "CWE-77"
    "confidence": "MEDIUM"
- id: "yaml-ci-pull-request-target"
  languages: ["yaml"]
  severity: "WARNING"
  category: "security:misconfig"
  message: "pull_request_target runs with write access on fork code"
  fix: "Use pull_request or isolate untrusted checkouts"
  pattern: "pull_request_target"
  metadata:
    "owasp": "A05:2021-Misconfiguration"
    "cwe": "CWE-829"
    "confidence": "MEDIUM"
- id: "yaml-aws-secret-key"
  languages: ["yaml"]
  severity: "ERROR"
  category: "security:secrets"
  message: "AWS secret access key committed in YAML"
  fix: "Reference the key from a secret manager"
  pattern: "aws_secret_access_key:"
  metadata:
    "owasp": "A07:2021-Identification-Auth"
    "cwe": "CWE-798"
    "confidence": "HIGH"
- id: "yaml-k8s-automount-token"
  languages: ["yaml"]
  severity: "INFO"
  category: "security:misconfig"
  message: "Service account token auto-mounted into the pod"
  fix: "Set automountServiceAccountToken: false when unused"
  pattern: "automountServiceAccountToken: true"
  metadata:
    "owasp": "A05:2021-Misconfiguration"
    "cwe": "CWE-200"
    "confidence": "LOW"
