- id: "yaml-gha-node-eol"
  languages: ["yaml"]
  severity: "WARNING"
  category: "security:misconfig"
  message: "GitHub Action uses an EOL Node runtime (12/14/16)"
  fix: "Upgrade to node-version: 20 or newer"
  pattern-either:
    - pattern: "node-version: 12"
    - pattern: "node-version: 14"
    - pattern: "node-version: 16"
  metadata:
    "owasp": "A06:2021-Vulnerable-Components"
    "cwe": "CWE-1104"
    "confidence": "MEDIUM"
- id: "yaml-gha-ref-context"
  languages: ["yaml"]
  severity: "WARNING"
  category: "security:code-execution"
  message: "github.ref/head_ref interpolated into script (injection)"
  fix: "Pass values via env: and quote them in shell"
  pattern-either:
    - pattern: "github.ref"
    - pattern: "github.head_ref"
  metadata:
    "owasp": "A03:2021-Injection"
    "cwe": "CWE-94"
    "confidence": "MEDIUM"
- id: "yaml-k8s-cluster-admin"
  languages: ["yaml"]
  severity: "ERROR"
  category: "security:misconfig"
  message: "RBAC grants the cluster-admin role"
  fix: "Bind least-privilege roles instead of cluster-admin"
  pattern: "cluster-admin"
  metadata:
    "owasp": "A01:2021-Broken-Access-Control"
    "cwe": "CWE-269"
    "confidence": "MEDIUM"
- id: "yaml-k8s-kubelet-always-allow"
  languages: ["yaml"]
  severity: "ERROR"
  category: "security:misconfig"
  message: "Kubelet authorization-mode=AlwaysAllow"
  fix: "Use --authorization-mode=Webhook"
  pattern: "authorization-mode=AlwaysAllow"
  metadata:
    "owasp": "A01:2021-Broken-Access-Control"
    "cwe": "CWE-284"
    "confidence": "HIGH"
- id: "yaml-k8s-kubelet-readonly-port"
  languages: ["yaml"]
  severity: "WARNING"
  category: "security:misconfig"
  message: "Kubelet read-only port left open (10255)"
  fix: "Set --read-only-port=0"
  pattern: "read-only-port=10255"
  metadata:
    "owasp": "A05:2021-Misconfiguration"
    "cwe": "CWE-200"
    "confidence": "MEDIUM"
- id: "yaml-k8s-etcd-http"
  languages: ["yaml"]
  severity: "ERROR"
  category: "security:misconfig"
  message: "etcd client URLs over plain HTTP"
  fix: "Serve etcd client traffic over https://"
  pattern: "listen-client-urls=http://"
  metadata:
    "owasp": "A05:2021-Misconfiguration"
    "cwe": "CWE-319"
    "confidence": "HIGH"
- id: "yaml-k8s-external-ips"
  languages: ["yaml"]
  severity: "WARNING"
  category: "security:misconfig"
  message: "Service exposes externalIPs (bypasses LB controls)"
  fix: "Use LoadBalancer/Ingress with proper controls"
  pattern: "externalIPs:"
  metadata:
    "owasp": "A01:2021-Broken-Access-Control"
    "cwe": "CWE-284"
    "confidence": "MEDIUM"
- id: "yaml-k8s-share-process-ns"
  languages: ["yaml"]
  severity: "WARNING"
  category: "security:misconfig"
  message: "Pod shares the process namespace between containers"
  fix: "Remove shareProcessNamespace unless strictly needed"
  pattern: "shareProcessNamespace: true"
  metadata:
    "owasp": "A05:2021-Misconfiguration"
    "cwe": "CWE-250"
    "confidence": "MEDIUM"
- id: "yaml-ssh-dss-algo"
  languages: ["yaml"]
  severity: "WARNING"
  category: "security:weak-crypto"
  message: "SSH DSS/ssh-dss algorithm accepted (broken signatures)"
  fix: "Remove ssh-dss; use ed25519/rsa-sha2"
  pattern: "ssh-dss"
  metadata:
    "owasp": "A02:2021-Crypto-Failures"
    "cwe": "CWE-327"
    "confidence": "HIGH"
- id: "yaml-ssh-cbc-ciphers"
  languages: ["yaml"]
  severity: "WARNING"
  category: "security:weak-crypto"
  message: "SSH CBC-mode ciphers enabled"
  fix: "Prefer aes*-gcm@openssh.com and chacha20-poly1305"
  pattern-either:
    - pattern: "aes128-cbc"
    - pattern: "aes256-cbc"
  metadata:
    "owasp": "A02:2021-Crypto-Failures"
    "cwe": "CWE-327"
    "confidence": "MEDIUM"
- id: "yaml-ssh-empty-password"
  languages: ["yaml"]
  severity: "ERROR"
  category: "security:misconfig"
  message: "SSH permits empty passwords"
  fix: "Set PermitEmptyPasswords no"
  pattern: "PermitEmptyPasswords yes"
  metadata:
    "owasp": "A07:2021-Identification-Auth"
    "cwe": "CWE-521"
    "confidence": "HIGH"
- id: "yaml-ssh-weak-mac"
  languages: ["yaml"]
  severity: "WARNING"
  category: "security:weak-crypto"
  message: "SSH HMAC-SHA1 MACs enabled"
  fix: "Prefer hmac-sha2-512/hmac-sha2-256"
  pattern: "hmac-sha1"
  metadata:
    "owasp": "A02:2021-Crypto-Failures"
    "cwe": "CWE-327"
    "confidence": "MEDIUM"
- id: "yaml-ansible-http-download"
  languages: ["yaml"]
  severity: "WARNING"
  category: "security:misconfig"
  message: "Ansible downloads over plain HTTP (no integrity)"
  fix: "Use https:// URLs with checksums"
  pattern-either:
    - pattern: "url: http://"
    - pattern: "src: http://"
  metadata:
    "owasp": "A08:2021-Integrity-Failure"
    "cwe": "CWE-494"
    "confidence": "MEDIUM"
- id: "yaml-nginx-autoindex"
  languages: ["yaml"]
  severity: "WARNING"
  category: "security:misconfig"
  message: "nginx directory listing enabled (autoindex on)"
  fix: "Set autoindex off;"
  pattern: "autoindex on;"
  metadata:
    "owasp": "A05:2021-Misconfiguration"
    "cwe": "CWE-548"
    "confidence": "HIGH"
- id: "yaml-nginx-weak-tls"
  languages: ["yaml"]
  severity: "WARNING"
  category: "security:owasp-a2-crypto"
  message: "nginx accepts TLS 1.0/1.1"
  fix: "ssl_protocols TLSv1.2 TLSv1.3;"
  pattern-either:
    - pattern: "ssl_protocols TLSv1;"
    - pattern: "ssl_protocols TLSv1.1;"
    - pattern: "ssl_protocols TLSv1 TLSv1"
    - pattern: "ssl_protocols TLSv1.1 TLSv1"
  metadata:
    "owasp": "A02:2021-Crypto-Failures"
    "cwe": "CWE-327"
    "confidence": "MEDIUM"
- id: "yaml-spring-h2-console"
  languages: ["yaml"]
  severity: "ERROR"
  category: "security:misconfig"
  message: "H2 database console enabled (remote SQL/RCE surface)"
  fix: "Disable spring.h2.console.enabled outside development"
  pattern: "h2.console.enabled: true"
  metadata:
    "owasp": "A05:2021-Misconfiguration"
    "cwe": "CWE-284"
    "confidence": "HIGH"
- id: "yaml-spring-devtools"
  languages: ["yaml"]
  severity: "INFO"
  category: "security:misconfig"
  message: "spring-boot-devtools configured (dev features in prod)"
  fix: "Exclude devtools from production builds"
  pattern: "spring.devtools"
  metadata:
    "owasp": "A05:2021-Misconfiguration"
    "cwe": "CWE-489"
    "confidence": "LOW"
- id: "yaml-grafana-anonymous"
  languages: ["yaml"]
  severity: "ERROR"
  category: "security:misconfig"
  message: "Grafana anonymous access enabled"
  fix: "Set anonymous_enabled = false"
  pattern: "anonymous_enabled = true"
  metadata:
    "owasp": "A01:2021-Broken-Access-Control"
    "cwe": "CWE-287"
    "confidence": "MEDIUM"
- id: "yaml-mysql-skip-grants"
  languages: ["yaml"]
  severity: "ERROR"
  category: "security:misconfig"
  message: "MySQL started with --skip-grant-tables (no auth)"
  fix: "Remove skip-grant-tables outside offline recovery"
  pattern: "skip-grant-tables"
  metadata:
    "owasp": "A07:2021-Identification-Auth"
    "cwe": "CWE-284"
    "confidence": "HIGH"
- id: "yaml-pg-ssl-off"
  languages: ["yaml"]
  severity: "WARNING"
  category: "security:owasp-a2-crypto"
  message: "PostgreSQL SSL disabled"
  fix: "Set ssl: on with certificates"
  pattern-either:
    - pattern: "ssl: off"
    - pattern: "ssl = off"
  metadata:
    "owasp": "A02:2021-Crypto-Failures"
    "cwe": "CWE-319"
    "confidence": "MEDIUM"
- id: "yaml-ingress-no-ssl-redirect"
  languages: ["yaml"]
  severity: "WARNING"
  category: "security:owasp-a2-crypto"
  message: "Ingress disables HTTPS redirect"
  fix: "Set ssl-redirect: \"true\""
  pattern-either:
    - pattern: "ssl-redirect: \"false\""
    - pattern: "ssl-redirect: 'false'"
  metadata:
    "owasp": "A02:2021-Crypto-Failures"
    "cwe": "CWE-319"
    "confidence": "MEDIUM"
- id: "yaml-jupyter-token-empty"
  languages: ["yaml"]
  severity: "ERROR"
  category: "security:misconfig"
  message: "Jupyter notebook token auth disabled (empty token)"
  fix: "Set a strong token or require password auth"
  pattern-either:
    - pattern: "NotebookApp.token = ''"
    - pattern: "NotebookApp.token = \"\""
    - pattern: "ServerApp.token = ''"
    - pattern: "ServerApp.token = \"\""
  metadata:
    "owasp": "A07:2021-Identification-Auth"
    "cwe": "CWE-306"
    "confidence": "HIGH"
- id: "yaml-image-latest-tag"
  languages: ["yaml"]
  severity: "WARNING"
  category: "security:misconfig"
  message: "Container image pinned to the mutable :latest tag"
  fix: "Pin images to a digest or immutable version"
  pattern: ":latest"
  metadata:
    "owasp": "A06:2021-Vulnerable-Components"
    "cwe": "CWE-829"
    "confidence": "MEDIUM"
- id: "yaml-ldap-starttls-off"
  languages: ["yaml"]
  severity: "WARNING"
  category: "security:owasp-a2-crypto"
  message: "LDAP client without StartTLS"
  fix: "Set start_tls: true"
  pattern: "start_tls: false"
  metadata:
    "owasp": "A02:2021-Crypto-Failures"
    "cwe": "CWE-319"
    "confidence": "MEDIUM"
