- id: "yaml-k8s-hostpid"
  languages: ["yaml"]
  severity: "WARNING"
  category: "security:misconfig"
  message: "Container shares the host PID namespace"
  fix: "Avoid hostPID unless strictly required"
  pattern: "hostPID: true"
  metadata:
    "owasp": "A05:2021-Misconfiguration"
    "cwe": "CWE-668"
    "confidence": "MEDIUM"
- id: "yaml-k8s-hostipc"
  languages: ["yaml"]
  severity: "WARNING"
  category: "security:misconfig"
  message: "Container shares the host IPC namespace"
  fix: "Avoid hostIPC unless strictly required"
  pattern: "hostIPC: true"
  metadata:
    "owasp": "A05:2021-Misconfiguration"
    "cwe": "CWE-668"
    "confidence": "MEDIUM"
- id: "yaml-k8s-service-nodeport"
  languages: ["yaml"]
  severity: "INFO"
  category: "security:misconfig"
  message: "Service exposed via NodePort"
  fix: "Use ClusterIP behind an ingress"
  pattern: "NodePort"
  metadata:
    "owasp": "A01:2021-Broken-Access-Control"
    "cwe": "CWE-284"
    "confidence": "LOW"
- id: "yaml-k8s-service-loadbalancer"
  languages: ["yaml"]
  severity: "INFO"
  category: "security:misconfig"
  message: "Service exposed via public LoadBalancer"
  fix: "Prefer an internal load balancer or ingress"
  pattern: "LoadBalancer"
  metadata:
    "owasp": "A01:2021-Broken-Access-Control"
    "cwe": "CWE-284"
    "confidence": "LOW"
- id: "yaml-gha-unpinned-ref"
  languages: ["yaml"]
  severity: "WARNING"
  category: "security:misconfig"
  message: "GitHub Action pinned to a mutable branch ref"
  fix: "Pin actions to a full commit SHA"
  pattern: "@master"
  metadata:
    "owasp": "A08:2021-Integrity-Failure"
    "cwe": "CWE-494"
    "confidence": "MEDIUM"
- id: "yaml-gha-write-all-permissions"
  languages: ["yaml"]
  severity: "WARNING"
  category: "security:misconfig"
  message: "Workflow grants write-all token permissions"
  fix: "Grant only the scopes the job needs"
  pattern: "write-all"
  metadata:
    "owasp": "A01:2021-Broken-Access-Control"
    "cwe": "CWE-269"
    "confidence": "MEDIUM"
- id: "yaml-gha-curl-pipe-sh"
  languages: ["yaml"]
  severity: "WARNING"
  category: "security:code-execution"
  message: "Remote script piped to a shell in CI"
  fix: "Download, verify, then run a pinned script"
  pattern: "| sh"
  metadata:
    "owasp": "A08:2021-Integrity-Failure"
    "cwe": "CWE-494"
    "confidence": "MEDIUM"
- id: "yaml-insecure-skip-verify"
  languages: ["yaml"]
  severity: "WARNING"
  category: "security:owasp-a2-crypto"
  message: "TLS certificate verification disabled"
  fix: "Keep certificate verification enabled"
  pattern: "insecure_skip_verify: true"
  metadata:
    "owasp": "A02:2021-Crypto-Failures"
    "cwe": "CWE-295"
    "confidence": "HIGH"
- id: "yaml-verify-ssl-false"
  languages: ["yaml"]
  severity: "WARNING"
  category: "security:owasp-a2-crypto"
  message: "SSL verification disabled"
  fix: "Enable SSL certificate verification"
  pattern: "verify_ssl: false"
  metadata:
    "owasp": "A02:2021-Crypto-Failures"
    "cwe": "CWE-295"
    "confidence": "HIGH"
- id: "yaml-verify-false"
  languages: ["yaml"]
  severity: "WARNING"
  category: "security:owasp-a2-crypto"
  message: "Request verification disabled"
  fix: "Enable certificate verification"
  pattern: "verify: false"
  metadata:
    "owasp": "A02:2021-Crypto-Failures"
    "cwe": "CWE-295"
    "confidence": "HIGH"
- id: "yaml-ssl-disabled"
  languages: ["yaml"]
  severity: "WARNING"
  category: "security:owasp-a2-crypto"
  message: "SSL disabled for a service"
  fix: "Enable SSL/TLS"
  pattern: "ssl: false"
  pattern-not: "verify_ssl"
  metadata:
    "owasp": "A02:2021-Crypto-Failures"
    "cwe": "CWE-319"
    "confidence": "MEDIUM"
- id: "yaml-token-plaintext"
  languages: ["yaml"]
  severity: "ERROR"
  category: "security:secrets"
  message: "Plaintext token committed in YAML"
  fix: "Reference the token from a secret manager"
  pattern: "token:"
  metadata:
    "owasp": "A07:2021-Identification-Auth"
    "cwe": "CWE-798"
    "confidence": "HIGH"
