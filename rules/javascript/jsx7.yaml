- id: "js-ejs-raw-output"
  languages: ["javascript"]
  severity: "WARNING"
  category: "security:owasp-a3-xss"
  message: "EJS raw output tag <%- (unescaped)"
  fix: "Use <%= unless the value is trusted HTML"
  pattern: "<%-"
  metadata:
    "owasp": "A03:2021-Injection"
    "cwe": "CWE-79"
    "confidence": "MEDIUM"
- id: "js-nosql-body-query"
  languages: ["javascript"]
  severity: "WARNING"
  category: "security:owasp-a1-injection"
  message: "Mongo query built from raw request body (operator injection)"
  fix: "Allowlist fields; never pass req.body straight to find"
  pattern-either:
    - pattern: "find(req.body)"
    - pattern: "findOne(req.body)"
  metadata:
    "owasp": "A03:2021-Injection"
    "cwe": "CWE-943"
    "confidence": "MEDIUM"
