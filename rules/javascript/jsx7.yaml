- id: "js-trust-proxy"
  languages: ["javascript"]
  severity: "WARNING"
  category: "security:misconfig"
  message: "Express trusts all proxies (client IP spoofing)"
  fix: "Configure trust proxy for your exact hop count/IP range"
  pattern-either:
    - pattern: "trust proxy', true"
    - pattern: "trust proxy\", true"
  metadata:
    "owasp": "A05:2021-Misconfiguration"
    "cwe": "CWE-290"
    "confidence": "MEDIUM"
- id: "js-superagent-ssrf"
  languages: ["javascript"]
  severity: "WARNING"
  category: "security:owasp-a10-ssrf"
  message: "superagent request with dynamic URL (SSRF)"
  fix: "Allowlist destinations and validate URLs"
  pattern-either:
    - pattern: "superagent.get($URL)"
    - pattern: "superagent.post($URL)"
    - pattern: "superagent.put($URL)"
    - pattern: "superagent.delete($URL)"
  metadata:
    "owasp": "A10:2021-SSRF"
    "cwe": "CWE-918"
    "confidence": "MEDIUM"
