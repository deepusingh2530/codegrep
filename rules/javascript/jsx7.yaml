- id: "js-hardcoded-shopify-key"
  languages: ["javascript"]
  severity: "WARNING"
  category: "security:secrets"
  message: "Hardcoded Shopify access token"
  fix: "Read the token from the environment"
  pattern-either:
    - pattern: "$VAR = \"shpat_$REST\""
    - pattern: "$VAR = 'shpat_$REST'"
    - pattern: "$VAR: \"shpat_$REST\""
    - pattern: "$VAR: 'shpat_$REST'"
  metadata:
    "owasp": "A07:2021-Identification-Auth"
    "cwe": "CWE-798"
    "confidence": "HIGH"
