  metadata:
    "owasp": "A03:2021-Injection"
    "cwe": "CWE-95"
    "confidence": "HIGH"
- id: "js-uuid-v1-token"
  languages: ["javascript"]
  severity: "WARNING"
  category: "security:weak-crypto"
  message: "uuid.v1 generates a timestamp/predictable token"
  fix: "Use uuid.v4() or crypto.randomUUID() for security tokens"
  pattern: "uuid.v1("
  metadata:
    "owasp": "A02:2021-Crypto-Failures"
    "cwe": "CWE-330"
    "confidence": "MEDIUM"
- id: "js-hardcoded-aws-key"
  languages: ["javascript"]
  severity: "WARNING"
  category: "security:secrets"
  message: "Hardcoded AWS access key id (AKIA...)"
  fix: "Read AWS_ACCESS_KEY_ID from the environment or a secrets manager"
  pattern-either:
    - pattern: "$VAR = \"AKIA$REST\""
    - pattern: "$VAR = 'AKIA$REST'"
    - pattern: "$VAR: \"AKIA$REST\""
    - pattern: "$VAR: 'AKIA$REST'"
  metavariable-regex:
    "REST": "^[0-9A-Z]{16}$"
  metadata:
    "owasp": "A07:2021-Identification-Auth"
    "cwe": "CWE-798"
    "confidence": "HIGH"
