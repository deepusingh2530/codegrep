- id: "js-cookie-samesite-none"
  languages: ["javascript"]
  severity: "WARNING"
  category: "security:misconfig"
  message: "Cookie set with SameSite=None (CSRF exposure unless Secure)"
  fix: "Use SameSite=Lax or SameSite=Strict with Secure"
  pattern-either:
    - pattern: "sameSite: \"none\""
    - pattern: "sameSite: 'none'"
    - pattern: "SameSite=None"
  metadata:
    "owasp": "A01:2021-Broken-Access-Control"
    "cwe": "CWE-352"
    "confidence": "MEDIUM"
- id: "js-bcrypt-low-rounds"
  languages: ["javascript"]
  severity: "ERROR"
  category: "security:weak-crypto"
  message: "bcrypt cost factor below 9 (fast to brute-force)"
  fix: "Use a bcrypt cost of at least 10"
  pattern-either:
    - pattern: "bcrypt.hashSync($P, $C)"
    - pattern: "bcrypt.hash($P, $C, ...)"
    - pattern: "bcrypt.genSaltSync($C)"
  metavariable-regex:
    "C": "^[1-8]$"
  metadata:
    "owasp": "A02:2021-Crypto-Failures"
    "cwe": "CWE-916"
    "confidence": "HIGH"
