- id: "js-jwt-ignore-expiration"
  languages: ["javascript"]
  severity: "WARNING"
  category: "security:owasp-a2-crypto"
  message: "JWT verification ignores expiration/not-before"
  fix: "Remove ignoreExpiration/ignoreNotBefore"
  pattern-either:
    - pattern: "ignoreExpiration: true"
    - pattern: "ignoreNotBefore: true"
  metadata:
    "owasp": "A07:2021-Identification-Auth"
    "cwe": "CWE-347"
    "confidence": "HIGH"
- id: "js-hardcoded-bearer-token"
  languages: ["javascript"]
  severity: "ERROR"
  category: "security:secrets"
  message: "Hardcoded bearer token"
  fix: "Read the token from the environment"
  pattern-either:
    - pattern: "Bearer $TOK\""
    - pattern: "Bearer $TOK'"
  metavariable-regex:
    "TOK": "^[A-Za-z0-9._-]{8,}$"
  metadata:
    "owasp": "A07:2021-Identification-Auth"
    "cwe": "CWE-798"
    "confidence": "HIGH"
