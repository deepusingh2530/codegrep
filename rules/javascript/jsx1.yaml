- id: "js-exec-file"
  languages: ["javascript"]
  severity: "ERROR"
  category: "security:code-execution"
  message: "execFile runs a program whose path may be user-controlled"
  fix: "Use a fixed executable and argument array"
  pattern: "execFile($FILE)"
  metavariable-regex:
    # A quoted executable is a fixed program -- the safe form this rule's own
    # `fix` recommends. Only flag a program path that is not a literal.
    "FILE": "^[^\"'].*$"
  metadata:
    "owasp": "A03:2021-Injection"
    "cwe": "CWE-78"
    "confidence": "HIGH"
- id: "js-exec-sync"
  languages: ["javascript"]
  severity: "ERROR"
  category: "security:code-execution"
  message: "execSync runs a shell command string"
  fix: "Use execFileSync with a fixed program"
  pattern: "execSync($CMD)"
  metadata:
    "owasp": "A03:2021-Injection"
    "cwe": "CWE-78"
    "confidence": "HIGH"
- id: "js-exec-file-sync"
  languages: ["javascript"]
  severity: "ERROR"
  category: "security:code-execution"
  message: "execFileSync runs a program whose path may be user-controlled"
  fix: "Use a fixed executable path"
  pattern: "execFileSync($FILE)"
  metadata:
    "owasp": "A03:2021-Injection"
    "cwe": "CWE-78"
    "confidence": "HIGH"
- id: "js-shell-option-true"
  languages: ["javascript"]
  severity: "WARNING"
  category: "security:code-execution"
  message: "child_process invoked with shell:true (shell injection risk)"
  fix: "Avoid shell:true; pass args as an array"
  pattern: "shell: true"
  metadata:
    "owasp": "A03:2021-Injection"
    "cwe": "CWE-78"
    "confidence": "MEDIUM"
- id: "js-vm-run-context"
  languages: ["javascript"]
  severity: "ERROR"
  category: "security:code-execution"
  message: "vm.runInNewContext executes untrusted code"
  fix: "Do not evaluate untrusted code in the VM"
  pattern: "vm.runInNewContext($CODE)"
  metadata:
    "owasp": "A03:2021-Injection"
    "cwe": "CWE-94"
    "confidence": "HIGH"
- id: "js-document-write"
  languages: ["javascript"]
  severity: "WARNING"
  category: "security:owasp-a3-xss"
  message: "document.write with untrusted input (XSS)"
  fix: "Use textContent or sanitize before inserting"
  pattern: "document.write($HTML)"
  metavariable-regex:
    "HTML": "^[A-Za-z_][A-Za-z0-9_]*$"
  metadata:
    "owasp": "A03:2021-Injection"
    "cwe": "CWE-79"
    "confidence": "MEDIUM"
- id: "js-location-assign"
  languages: ["javascript"]
  severity: "WARNING"
  category: "security:open-redirect"
  message: "location.assign redirects to a user-controlled URL"
  fix: "Allowlist redirect targets"
  pattern: "location.assign($URL)"
  metadata:
    "owasp": "A01:2021-Broken-Access-Control"
    "cwe": "CWE-601"
    "confidence": "MEDIUM"
