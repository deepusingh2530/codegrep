  message: "ejs.render compiled from untrusted input (SSTI)"
  fix: "Use fixed templates; never render user templates"
  pattern: "ejs.render($T)"
  metadata:
    "owasp": "A03:2021-Injection"
    "cwe": "CWE-1336"
    "confidence": "HIGH"
