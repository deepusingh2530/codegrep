- id: "js-lodash-template"
  languages: ["javascript"]
  severity: "ERROR"
  category: "security:ssti"
  message: "lodash template compiled from untrusted input (SSTI)"
  fix: "Use fixed templates; never compile user data"
  pattern: "_.template($T)"
  metadata:
    "owasp": "A03:2021-Injection"
    "cwe": "CWE-1336"
    "confidence": "HIGH"
