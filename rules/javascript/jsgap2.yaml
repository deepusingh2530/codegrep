- id: "js-redos-new-regexp"
  languages: ["javascript"]
  severity: "WARNING"
  category: "security:denial-of-service"
  message: "RegExp built from request input (ReDoS via catastrophic backtracking)"
  fix: "Constrain the pattern, cap input length, or use a linear-time engine"
  pattern: "new RegExp($PAT)"
  metavariable-regex:
    "PAT": "req\\.|params"
  metadata:
    "owasp": "A04:2021-Insecure-Design"
    "cwe": "CWE-1333"
    "confidence": "MEDIUM"
- id: "js-hardcoded-session-secret"
  languages: ["javascript"]
  severity: "ERROR"
  category: "security:secrets"
  message: "Session/signing secret hard-coded in source"
  fix: "Read the secret from the environment or a secret manager"
  pattern-either:
    - pattern: "secret: \""
    - pattern: "secret: '"
  metadata:
    "owasp": "A07:2021-Identification-Auth"
    "cwe": "CWE-798"
    "confidence": "HIGH"
- id: "js-path-resolve-traversal"
  languages: ["javascript"]
  severity: "ERROR"
  category: "security:path-traversal"
  message: "path.resolve appends a user-controlled component (path traversal)"
  fix: "Reject '..' components and verify the resolved path stays under the root"
  pattern: "path.resolve($BASE, $USER)"
  metavariable-regex:
    "USER": "req\\.|params"
  metadata:
    "owasp": "A01:2021-Broken-Access-Control"
    "cwe": "CWE-22"
    "confidence": "MEDIUM"
- id: "js-ssrf-extra-libs"
  languages: ["javascript"]
  severity: "ERROR"
  category: "security:owasp-a10-ssrf"
  message: "Server-side request to a dynamic URL (SSRF)"
  fix: "Allowlist destination hosts or map the parameter to known endpoints"
  pattern-either:
    - pattern: "https.get($URL)"
    - pattern: "axios.post($URL, ...)"
    - pattern: "request.get($URL)"
  metadata:
    "owasp": "A10:2021-SSRF"
    "cwe": "CWE-918"
    "confidence": "MEDIUM"
- id: "js-location-href-redirect"
  languages: ["javascript"]
  severity: "ERROR"
  category: "security:open-redirect"
  message: "Browser redirected via location assignment (open redirect)"
  fix: "Map the parameter to an allowlist of local destinations"
  pattern-either:
    - pattern: "location.href = $URL"
    - pattern: "location.replace($URL)"
  metadata:
    "owasp": "A01:2021-Broken-Access-Control"
    "cwe": "CWE-601"
    "confidence": "MEDIUM"
- id: "js-mustache-render"
  languages: ["javascript"]
  severity: "ERROR"
  category: "security:ssti"
  message: "Mustache template rendered from dynamic input (SSTI)"
  fix: "Render a fixed template; pass user data only as view model values"
  pattern: "mustache.render($TMPL)"
  metadata:
    "owasp": "A03:2021-Injection"
    "cwe": "CWE-1336"
    "confidence": "MEDIUM"
- id: "js-vm-run-this-context"
  languages: ["javascript"]
  severity: "ERROR"
  category: "security:code-execution"
  message: "vm.runInThisContext executes dynamic code"
  fix: "Do not evaluate dynamic scripts; use fixed logic or a sandboxed worker"
  pattern: "vm.runInThisContext($CODE)"
  metadata:
    "owasp": "A03:2021-Injection"
    "cwe": "CWE-94"
    "confidence": "HIGH"
- id: "js-debugger-statement"
  languages: ["javascript"]
  severity: "INFO"
  category: "security:misconfig"
  message: "debugger statement left in code"
  fix: "Remove debugger statements before release"
  pattern: "debugger;"
  metadata:
    "owasp": "A05:2021-Misconfiguration"
    "cwe": "CWE-489"
    "confidence": "HIGH"
- id: "js-hardcoded-iv"
  languages: ["javascript"]
  severity: "WARNING"
  category: "security:weak-crypto"
  message: "Cipher IV is a hard-coded string literal"
  fix: "Generate a random IV per encryption (crypto.randomBytes)"
  pattern: "createCipheriv($ALG, $KEY, \""
  metadata:
    "owasp": "A02:2021-Crypto-Failures"
    "cwe": "CWE-329"
    "confidence": "HIGH"
- id: "js-jquery-append"
  languages: ["javascript"]
  severity: "WARNING"
  category: "security:owasp-a3-xss"
  message: "jQuery/DOM append injects unescaped request data (XSS)"
  fix: "Use .text() for data or sanitize HTML before appending"
  pattern: ".append($X)"
  metavariable-regex:
    "X": "req\\.|params"
  metadata:
    "owasp": "A03:2021-Injection"
    "cwe": "CWE-79"
    "confidence": "MEDIUM"
- id: "js-mongoose-where"
  languages: ["javascript"]
  severity: "ERROR"
  category: "security:owasp-a1-injection"
  message: "MongoDB $where executes JavaScript (NoSQL injection)"
  fix: "Use operator expressions instead of $where"
  pattern: "\"$WHERE\""
  metavariable-regex:
    "WHERE": "^\\$where$"
  metadata:
    "owasp": "A03:2021-Injection"
    "cwe": "CWE-943"
    "confidence": "HIGH"
- id: "js-hardcoded-jwt-secret"
  languages: ["javascript"]
  severity: "ERROR"
  category: "security:secrets"
  message: "JWT signed with a hard-coded literal key"
  fix: "Load the signing key from the environment or a KMS"
  pattern-either:
    - pattern: "jwt.sign($P, \""
    - pattern: "jwt.sign($P, '"
  metadata:
    "owasp": "A07:2021-Identification-Auth"
    "cwe": "CWE-798"
    "confidence": "HIGH"
- id: "js-copyfile-traversal"
  languages: ["javascript"]
  severity: "ERROR"
  category: "security:path-traversal"
  message: "fs.copyFile destination comes from request input (path traversal)"
  fix: "Resolve the destination under a fixed root and reject traversal"
  pattern: "fs.copyFile($SRC, $DST)"
  metavariable-regex:
    "DST": "req\\.|params"
  metadata:
    "owasp": "A01:2021-Broken-Access-Control"
    "cwe": "CWE-22"
    "confidence": "MEDIUM"
- id: "js-fork-user-module"
  languages: ["javascript"]
  severity: "ERROR"
  category: "security:code-execution"
  message: "child_process fork loads a module from request input"
  fix: "Fork a fixed module path; never take module names from users"
  pattern: "fork($MOD)"
  metavariable-regex:
    "MOD": "req\\.|params"
  metadata:
    "owasp": "A03:2021-Injection"
    "cwe": "CWE-94"
    "confidence": "MEDIUM"
