[package]
name = "codegrep"
version = "0.12.0"
edition = "2021"
authors = ["Deepu Singh <dksingh1130@gmail.com>"]
license = "MIT"
description = "Fast offline multi-language SAST scanner with a curated MIT-original rule corpus"
repository = "https://github.com/deepusingh2530/codegrep"
keywords = ["sast", "security", "static-analysis", "sarif", "scanner"]
categories = ["command-line-utilities", "security", "development-tools"]
readme = "README.md"

[lib]
name = "codegrep"
path = "src/lib.rs"

[[bin]]
name = "codegrep"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
anyhow = { workspace = true }
rayon = { workspace = true }
ignore = { workspace = true }
cg-parser = { path = "../cg-parser", version = "0.2.0" }
cg-matcher = { path = "../cg-matcher", version = "0.1.1" }
cg-taint = { path = "../cg-taint", version = "0.1.1" }
cg-rules = { path = "../cg-rules", version = "0.2.1" }
