[package]
name = "cg-parser"
version = "0.1.0"
edition = "2021"
authors = ["Deepu Singh <dksingh1130@gmail.com>"]
license = "MIT"
description = "Tree-sitter language bindings and language detection for codegrep"
repository = "https://github.com/deepusingh2530/codegrep"
keywords = ["static-analysis", "security", "parser"]
categories = ["development-tools"]

[dependencies]
tree-sitter = { workspace = true }
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.23"
tree-sitter-java = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-php = "0.23"
tree-sitter-c-sharp = "0.23"
anyhow = { workspace = true }
