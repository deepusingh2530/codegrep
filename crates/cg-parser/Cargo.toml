[package]
name = "cg-parser"
version = "0.2.0"
edition = "2021"
authors = ["Deepu Singh <dksingh1130@gmail.com>"]
license = "PolyForm-Noncommercial-1.0.0"
description = "Tree-sitter language bindings and language detection for scanward"
repository = "https://github.com/deepusingh2530/scanward"
keywords = ["static-analysis", "security", "parser"]
categories = ["development-tools"]

[dependencies]
tree-sitter = { workspace = true }
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-php = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
anyhow = { workspace = true }
