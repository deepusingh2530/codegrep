[workspace]
members = [
  "crates/cg-parser",
  "crates/cg-ir",
  "crates/cg-matcher",
  "crates/cg-taint",
  "crates/cg-rules",
  "crates/cg-deps",
  "crates/scanward",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
rayon = "1"
ignore = "0.4"
clap = { version = "4", features = ["derive"] }
tree-sitter = "0.27"
aho-corasick = "1"
toml = "0.9"
